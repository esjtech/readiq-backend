services:
  - type: web
    name: readiq-api
    runtime: node
    plan: free            # change to "starter" before launch: free instances sleep and cold-start
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY      # optional: AI voice + audio transcription
        sync: false
      - key: CONVERTAPI_SECRET    # online Word/HTML to PDF (plain .txt works without it)
        sync: false
      - key: PAYSTACK_SECRET_KEY   # sk_test_... while testing, sk_live_... for real money
        sync: false
